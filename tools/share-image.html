<!doctype html>
<!-- Link-preview image (1200×630) for WhatsApp, LinkedIn, Google: open at exactly 1200×630 and screenshot to
     assets/img/og-image.png. MIT-WPU Brand Book 2026 palette 1 (Navy #11468F, Orange #FFA500, Peach #FFE5B4), Lato. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Lato, sans-serif; color: #fff; position: relative;
         background: linear-gradient(120deg, #0B2A57 0%, #11468F 70%, #0C3570 100%); }
  .streaks { position: absolute; right: -40px; top: 120px; width: 560px; display: flex; flex-direction: column; align-items: flex-end; gap: 22px; transform: skewX(-24deg); opacity: .9; }
  .streaks i { display: block; height: 16px; border-radius: 99px 0 0 99px; }
  .copy { position: absolute; left: 72px; top: 86px; width: 700px; }
  .eyebrow { font-weight: 900; letter-spacing: .14em; font-size: 24px; color: #FFA500; text-transform: uppercase; }
  h1 { margin: 22px 0 0; font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 92px; line-height: .9; letter-spacing: -.01em; }
  h1 span { color: #FFA500; }
  p { margin: 30px 0 0; font-size: 30px; font-weight: 700; color: #D4E0F2; }
  .url { font-size: 24px; font-weight: 400; color: #B9CCEA; margin-top: 14px; }
  .logo { position: absolute; right: 86px; top: 150px; width: 300px; padding: 34px 34px 28px; background: #fff; border-radius: 24px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45); }
  .logo img { width: 100%; display: block; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: linear-gradient(90deg, #FFA500 0 60%, #FFE5B4 100%); }
</style></head>
<body>
  <div class="streaks"><i style="width:55%;background:#FFA500"></i><i style="width:80%;background:#FFE5B4"></i><i style="width:100%;background:#FFA500"></i><i style="width:70%;background:rgba(255,255,255,.85)"></i><i style="width:45%;background:#FFE5B4"></i></div>
  <div class="copy">
    <div class="eyebrow">MIT World Peace University</div>
    <h1>Department<br>of <span>Sports</span></h1>
    <p>Teams · Trials · Events · Results</p>
    <div class="url">SITE_URL_HERE</div>
  </div>
  <div class="logo"><img src="../assets/img/logo/mitwpu-logo-compact.png" alt=""></div>
  <div class="bar"></div>
</body></html>
